<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelo de Risco de Crédito</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 18px; background:#f5f6f8; color:#20242c; }
    .card { background:white; padding:24px; border-radius:14px; margin-bottom:18px; box-shadow:0 2px 10px #0001; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
    label { display:flex; flex-direction:column; gap:6px; font-weight:600; }
    input, select, button { padding:10px; border:1px solid #cfd4dc; border-radius:8px; font-size:1rem; }
    button { margin-top:18px; cursor:pointer; background:#20242c; color:white; }
    #resultado { font-size:1.15rem; font-weight:700; }
    .baixo { color:#237a3b; } .alto { color:#b42318; }
  </style>
</head>
<body>
  <h1>Risco de inadimplência</h1>
  <p>Modelo supervisionado para apoiar a análise de pedidos de empréstimo.</p>

  <div class="card">
    <form id="form">
      <div class="grid" id="campos"></div>
      <button type="submit">Calcular risco</button>
    </form>
  </div>

  <div class="card">
    <h2>Resultado</h2>
    <div id="resultado">Preencha os dados e envie.</div>
  </div>

<script>
const features = {{ problema["features"] | tojson }};

for (const [nome, regra] of Object.entries(features)) {
  const label = document.createElement("label");
  label.textContent = nome.replaceAll("_", " ");

  let campo;
  if (regra.tipo === "categoria") {
    campo = document.createElement("select");
    for (const opcao of regra.opcoes) {
      const opt = document.createElement("option");
      opt.value = opcao; opt.textContent = opcao;
      if (opcao === regra.padrao) opt.selected = true;
      campo.appendChild(opt);
    }
  } else {
    campo = document.createElement("input");
    campo.type = "number";
    campo.step = "any";
    campo.min = regra.min;
    campo.max = regra.max;
    campo.value = regra.padrao;
  }
  campo.name = nome;
  label.appendChild(campo);
  document.getElementById("campos").appendChild(label);
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const dados = Object.fromEntries(new FormData(e.target).entries());
  const resp = await fetch("/api/prever", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(dados)
  });
  const r = await resp.json();
  const el = document.getElementById("resultado");
  if (!resp.ok) { el.textContent = r.erro; el.className = "alto"; return; }
  const pct = (100 * r.probabilidade).toFixed(1);
  el.textContent = `${pct}% de probabilidade — ${r.classificacao.toUpperCase()} (limiar ${r.limiar_recomendado})`;
  el.className = r.classificacao === "alto risco" ? "alto" : "baixo";
});
</script>
</body>
</html>
